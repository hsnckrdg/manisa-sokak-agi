
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manisa Sokak Ağı</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1f2937;
    background: #f4f6f8;
}

header {
    background: #111827;
    color: white;
    padding: 16px 20px;
}

header h1 {
    margin: 0 0 5px;
    font-size: 23px;
}

header p {
    margin: 0;
    color: #d1d5db;
}

.controls {
    background: white;
    padding: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #ddd;
}

input, select, button {
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
}

button {
    background: #111827;
    color: white;
    cursor: pointer;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 300px;
}

#networkWrap {
    background: white;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 680px;
    display: block;
    cursor: grab;
}

svg:active {
    cursor: grabbing;
}

#details {
    padding: 18px;
    border-left: 1px solid #ddd;
    background: #f8fafc;
}

#details h2 {
    margin-top: 0;
}

.row {
    margin-bottom: 12px;
}

.label {
    font-size: 12px;
    color: #64748b;
}

.value {
    font-weight: bold;
    margin-top: 3px;
    word-break: break-word;
}

.legend {
    background: white;
    border-top: 1px solid #ddd;
    padding: 12px 18px;
    font-size: 13px;
}

.red {
    display: inline-block;
    width: 26px;
    height: 4px;
    background: red;
    margin: 0 6px 2px 18px;
}

.nodeSelected {
    stroke: black !important;
    stroke-width: 3px !important;
}

@media(max-width:800px) {

    .layout {
        grid-template-columns: 1fr;
    }

    #details {
        border-left: none;
        border-top: 1px solid #ddd;
    }
}

</style>
</head>

<body>

<header>
    <h1>Manisa Kent Merkezi Sokak Ağı</h1>
    <p>
        Şehzadeler + Yunusemre |
        1200 önemli düğüm |
        Leiden toplulukları
    </p>
</header>

<div class="controls">

    <input
        id="search"
        placeholder="Düğüm ID ara..."
    >

    <button id="searchBtn">
        Ara
    </button>

    <select id="community">
        <option value="all">
            Tüm topluluklar
        </option>
    </select>

    <button id="reset">
        Görünümü Sıfırla
    </button>

</div>

<div class="layout">

<div id="networkWrap">

<svg
    id="network"
    viewBox="0 0 1200 700"
>

<g id="viewport">

<g id="edges"></g>

<g id="nodes"></g>

</g>

</svg>

</div>

<div id="details">

<h2>Düğüm Detayı</h2>

<p>
Haritada bir kavşağa tıklayın.
</p>

</div>

</div>

const svg =
    document.getElementById("network");

const viewport =
    document.getElementById("viewport");

const edgeLayer =
    document.getElementById("edges");

const nodeLayer =
    document.getElementById("nodes");

const details =
    document.getElementById("details");

const communitySelect =
    document.getElementById("community");


const ns =
    "http://www.w3.org/2000/svg";


// ==========================
// KONUM ÖLÇEKLEME
// ==========================

const lons =
    nodes.map(n => n.lon);

const lats =
    nodes.map(n => n.lat);

const minLon = Math.min(...lons);
const maxLon = Math.max(...lons);

const minLat = Math.min(...lats);
const maxLat = Math.max(...lats);

function sx(lon) {

    return 40 +
        (lon - minLon) /
        (maxLon - minLon) *
        1120;
}

function sy(lat) {

    return 650 -
        (lat - minLat) /
        (maxLat - minLat) *
        600;
}


const nodeMap = {};

nodes.forEach(n => {

    n.x = sx(n.lon);
    n.y = sy(n.lat);

    nodeMap[n.id] = n;

});


// ==========================
// TOPLULUK MENÜSÜ
// ==========================

const communities =
    [...new Set(
        nodes.map(n => n.community)
    )].sort((a,b) => a-b);

communities.forEach(c => {

    const opt =
        document.createElement("option");

    opt.value = c;
    opt.textContent =
        "Topluluk " + c;

    communitySelect.appendChild(opt);

});


// ==========================
// RENK
// ==========================

function communityColor(c) {

    const hue =
        (c * 137) % 360;

    return `hsl(${hue},65%,52%)`;
}


// ==========================
// EDGE ÇİZ
// ==========================

const edgeEls = [];

edges.forEach(e => {

    const s = nodeMap[e.source];
    const t = nodeMap[e.target];

    if (!s || !t)
        return;

    const line =
        document.createElementNS(
            ns,
            "line"
        );

    line.setAttribute("x1", s.x);
    line.setAttribute("y1", s.y);

    line.setAttribute("x2", t.x);
    line.setAttribute("y2", t.y);

    line.setAttribute(
        "stroke",
        e.critical
        ? "#dc2626"
        : "#cbd5e1"
    );

    line.setAttribute(
        "stroke-width",
        e.critical
        ? "3.5"
        : "0.7"
    );

    line.setAttribute(
        "opacity",
        e.critical
        ? "1"
        : "0.55"
    );

    line.style.cursor =
        "pointer";

    line.addEventListener(
        "click",
        ev => {

            ev.stopPropagation();

            details.innerHTML = `
                <h2>Yol Detayı</h2>

                <div class="row">
                    <div class="label">
                        Yol
                    </div>

                    <div class="value">
                        ${e.road}
                    </div>
                </div>

                <div class="row">
                    <div class="label">
                        Uzunluk
                    </div>

                    <div class="value">
                        ${e.length.toFixed(1)} m
                    </div>
                </div>

                <div class="row">
                    <div class="label">
                        Kritik yol
                    </div>

                    <div class="value">
                        ${e.critical
                        ? "Evet"
                        : "Hayır"}
                    </div>
                </div>
            `;
        }
    );

    edgeLayer.appendChild(line);

    edgeEls.push({
        el: line,
        data: e
    });

});


// ==========================
// NODE ÇİZ
// ==========================

const nodeEls = {};

const maxBet =
    Math.max(
        ...nodes.map(n =>
            n.betweenness
        )
    );

nodes.forEach(n => {

    const circle =
        document.createElementNS(
            ns,
            "circle"
        );

    const r =
        2.5 +
        (
            maxBet > 0
            ? n.betweenness /
              maxBet * 8
            : 0
        );

    circle.setAttribute(
        "cx",
        n.x
    );

    circle.setAttribute(
        "cy",
        n.y
    );

    circle.setAttribute(
        "r",
        r
    );

    circle.setAttribute(
        "fill",
        communityColor(
            n.community
        )
    );

    circle.setAttribute(
        "stroke",
        "#334155"
    );

    circle.setAttribute(
        "stroke-width",
        "0.4"
    );

    circle.style.cursor =
        "pointer";

    circle.addEventListener(
        "click",
        ev => {

            ev.stopPropagation();

            selectNode(n.id);

        }
    );

    nodeLayer.appendChild(circle);

    nodeEls[n.id] = circle;

});


// ==========================
// NODE DETAY
// ==========================

let selectedId = null;

function selectNode(id) {

    if (selectedId &&
        nodeEls[selectedId]) {

        nodeEls[selectedId]
            .classList
            .remove(
                "nodeSelected"
            );
    }

    const n = nodeMap[id];

    if (!n)
        return;

    selectedId = id;

    nodeEls[id]
        .classList
        .add(
            "nodeSelected"
        );

    details.innerHTML = `

        <h2>Kavşak ${n.id}</h2>

        <div class="row">

            <div class="label">
                Leiden topluluğu
            </div>

            <div class="value">
                ${n.community}
            </div>

        </div>

        <div class="row">

            <div class="label">
                Betweenness
            </div>

            <div class="value">
                ${n.betweenness.toFixed(6)}
            </div>

        </div>

        <div class="row">

            <div class="label">
                Degree centrality
            </div>

            <div class="value">
                ${n.degree.toFixed(6)}
            </div>

        </div>

        <div class="row">

            <div class="label">
                Closeness
            </div>

            <div class="value">
                ${n.closeness.toFixed(6)}
            </div>

        </div>

        <div class="row">

            <div class="label">
                PageRank
            </div>

            <div class="value">
                ${n.pagerank.toFixed(8)}
            </div>

        </div>

        <div class="row">

            <div class="label">
                500 m çevresindeki POI
            </div>

            <div class="value">
                ${n.poi}
            </div>

        </div>

        <div class="row">

            <div class="label">
                Koordinat
            </div>

            <div class="value">
                ${n.lat.toFixed(6)},
                ${n.lon.toFixed(6)}
            </div>

        </div>
    `;
}


// ==========================
// FİLTRE
// ==========================

function applyFilter() {

    const value =
        communitySelect.value;

    nodes.forEach(n => {

        const visible =
            value === "all" ||
            String(n.community)
            === value;

        nodeEls[n.id]
            .style
            .display =
            visible
            ? ""
            : "none";
    });

    edgeEls.forEach(item => {

        const a =
            nodeMap[
                item.data.source
            ];

        const b =
            nodeMap[
                item.data.target
            ];

        const visible =
            value === "all" ||
            (
                String(a.community)
                === value &&
                String(b.community)
                === value
            );

        item.el.style.display =
            visible
            ? ""
            : "none";
    });
}

communitySelect
.addEventListener(
    "change",
    applyFilter
);


// ==========================
// SEARCH
// ==========================

function searchNode() {

    const id =
        document
        .getElementById("search")
        .value
        .trim();

    if (!nodeMap[id]) {

        alert(
            "Bu düğüm seçilen "
            + "1200 düğüm içinde yok."
        );

        return;
    }

    communitySelect.value =
        "all";

    applyFilter();

    selectNode(id);
}

document
.getElementById("searchBtn")
.addEventListener(
    "click",
    searchNode
);

document
.getElementById("search")
.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter")
            searchNode();

    }
);


// ==========================
// PAN + ZOOM
// ==========================

let scale = 1;
let tx = 0;
let ty = 0;

function updateTransform() {

    viewport.setAttribute(
        "transform",
        `translate(${tx} ${ty}) scale(${scale})`
    );
}


svg.addEventListener(
    "wheel",
    e => {

        e.preventDefault();

        const factor =
            e.deltaY < 0
            ? 1.15
            : 0.87;

        scale *= factor;

        scale =
            Math.max(
                0.5,
                Math.min(
                    scale,
                    10
                )
            );

        updateTransform();

    },
    {
        passive: false
    }
);


let dragging = false;
let lastX = 0;
let lastY = 0;

svg.addEventListener(
    "mousedown",
    e => {

        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;

    }
);

window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

    }
);

window.addEventListener(
    "mousemove",
    e => {

        if (!dragging)
            return;

        tx +=
            e.clientX - lastX;

        ty +=
            e.clientY - lastY;

        lastX = e.clientX;
        lastY = e.clientY;

        updateTransform();

    }
);


// ==========================
// RESET
// ==========================

document
.getElementById("reset")
.addEventListener(
    "click",
    () => {

        scale = 1;
        tx = 0;
        ty = 0;

        updateTransform();

        communitySelect.value =
            "all";

        applyFilter();

        document
        .getElementById("search")
        .value = "";

    }
);

</script>

</body>
</html>
